<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avenex Docs</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1117;
        --panel: #121a23;
        --line: #263645;
        --text: #edf5ff;
        --muted: #9fb0c2;
        --accent: #24b7d8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(34px, 6vw, 58px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.55;
      }

      .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 42px;
      }

      a {
        display: block;
        min-height: 150px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        border-color: var(--accent);
      }

      strong {
        display: block;
        margin-bottom: 10px;
        color: var(--accent);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Avenex Docs</h1>
      <p>Public documentation for Avenex Studios projects.</p>
      <section class="projects" aria-label="Projects">
        <a href="./AvenexRaceControl/">
          <strong>Avenex Race Control</strong>
          <span>Incident scoring, stewarding overlays, server administration and race-control automation for Assetto Corsa.</span>
        </a>
      </section>
    </main>
  </body>
</html>
