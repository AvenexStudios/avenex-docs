site_name: CoDriver AI Race Engineer
site_description: Team radio and offline race engineer assistant for sim racing.
site_url: https://docs.avenexstudio.com/CoDriverAIRaceEngineer/
repo_url: https://github.com/AvenexStudios/avenex-docs
repo_name: AvenexStudios/avenex-docs
edit_uri: ""

docs_dir: docs
exclude_docs: |
  es/
site_dir: ../site/CoDriverAIRaceEngineer

theme:
  name: material
  custom_dir: ../AvenexRaceControl/overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode

plugins:
  - search

extra:
  product_version: "0.1.0"
  version_label: "Preview version"
  alternate:
    - name: English
      link: /CoDriverAIRaceEngineer/
      lang: en
    - name: Español
      link: /CoDriverAIRaceEngineer/es/
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Downloads: downloads.md
  - Installation: installation.md
  - Team Radio: team-radio.md
  - Spotter: spotter.md
  - Race Engineer: race-engineer.md
  - Troubleshooting: troubleshooting.md
  - Versions: versions.md
