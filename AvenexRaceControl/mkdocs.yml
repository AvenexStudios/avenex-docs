site_name: Avenex Race Control
site_description: Race control, stewarding overlays and server administration for Assetto Corsa.
site_url: https://docs.avenexstudio.com/AvenexRaceControl/
repo_url: https://github.com/AvenexStudios/avenex-docs
repo_name: AvenexStudios/avenex-docs
edit_uri: ""

docs_dir: docs
exclude_docs: |
  es/
site_dir: ../site/AvenexRaceControl

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode

plugins:
  - search

extra:
  product_version: "0.1.0"
  version_label: "Preview version"
  alternate:
    - name: English
      link: /AvenexRaceControl/
      lang: en
    - name: Español
      link: /AvenexRaceControl/es/
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Downloads: downloads.md
  - Installation: installation.md
  - Server Admin: server-admin.md
  - Incidents: incidents.md
  - Overlays:
      - Overview: overlays/index.md
      - Gallery: overlays/gallery.md
  - Rules And Sanctions: rules-and-sanctions.md
  - Troubleshooting: troubleshooting.md
  - Versions: versions.md
