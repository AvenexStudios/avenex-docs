site_name: Avenex Race Control
site_description: Race control, stewarding overlays and server administration for Assetto Corsa.
site_url: https://avenexstudios.github.io/avenex-docs/AvenexRaceControl/
repo_url: https://github.com/AvenexStudios/avenex-docs
repo_name: AvenexStudios/avenex-docs
edit_uri: edit/main/AvenexRaceControl/docs/

docs_dir: docs
site_dir: ../site/AvenexRaceControl

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Server Admin: server-admin.md
  - Overlays: overlays.md
  - Rules And Sanctions: rules-and-sanctions.md
  - Troubleshooting: troubleshooting.md

