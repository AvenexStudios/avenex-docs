INHERIT: mkdocs.yml
site_url: https://docs.avenexstudio.com/AvenexRaceControl/es/
site_description: Guía de uso y administración de Avenex Race Control.
docs_dir: docs/es
site_dir: ../site/AvenexRaceControl/es
exclude_docs: ""
theme:
  language: es
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Modo oscuro
extra:
  version_label: "Versión preliminar"
nav:
  - Inicio: index.md
  - Instalación: installation.md
  - Administración: server-admin.md
  - Incidentes: incidents.md
  - Overlays:
      - Resumen: overlays/index.md
      - Galería: overlays/gallery.md
  - Reglas y sanciones: rules-and-sanctions.md
  - Solución de problemas: troubleshooting.md
  - Versiones: versions.md
